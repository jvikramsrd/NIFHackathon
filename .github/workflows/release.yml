name: Build & Release

# Triggers:
#   - Push a tag like v1.0.0  → builds all platforms + creates GitHub Release
#   - workflow_dispatch       → manual trigger from the Actions tab
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows x64 ──────────────────────────────────────────────────
          - os: windows-latest
            name: Windows x64
            artifact_name: GeoIntel-windows-x64
            binary_path: dist/GeoIntel

          # ── macOS Intel ──────────────────────────────────────────────────
          - os: macos-13
            name: macOS Intel
            artifact_name: GeoIntel-macos-intel
            binary_path: dist/GeoIntel.app

          # ── macOS Apple Silicon ─────────────────────────────────────────
          - os: macos-14
            name: macOS Apple Silicon (M1/M2/M3)
            artifact_name: GeoIntel-macos-arm64
            binary_path: dist/GeoIntel.app

          # ── Linux x64 ────────────────────────────────────────────────────
          - os: ubuntu-22.04
            name: Linux x64
            artifact_name: GeoIntel-linux-x64
            binary_path: dist/GeoIntel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── Linux: install Qt system deps ─────────────────────────────────────
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxkbcommon-x11-0 libxkbcommon0 \
            libgdal-dev

      # ── macOS: install GDAL via Homebrew ──────────────────────────────────
      - name: Install GDAL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gdal

      # ── Python deps (CPU torch — no CUDA needed for the GUI binary) ───────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          # CPU torch keeps the binary manageable; GPU support is in the user env
          pip install torch torchvision torchaudio \
            --index-url https://download.pytorch.org/whl/cpu
          pip install \
            PyQt6>=6.6.0 \
            opencv-python>=4.9.0 \
            numpy>=1.26.0 \
            matplotlib>=3.8.0 \
            rasterio>=1.3.0 \
            pyproj>=3.6.0 \
            pyinstaller>=6.5.0

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build binary
        run: python build.py

      # ── Package the output ────────────────────────────────────────────────
      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\GeoIntel -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Package binary (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          cd dist
          if [ -d GeoIntel.app ]; then
            zip -r ../${{ matrix.artifact_name }}.zip GeoIntel.app
          else
            zip -r ../${{ matrix.artifact_name }}.zip GeoIntel
          fi

      # ── Upload build artifact ─────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          retention-days: 30

  # ── Create GitHub Release when a version tag is pushed ──────────────────────
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Geo-Intel ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/**/*.zip
          body: |
            ## Geo-Intel Pipeline — ${{ github.ref_name }}

            ### Downloads

            | Platform | File |
            |----------|------|
            | Windows 10/11 (x64) | `GeoIntel-windows-x64.zip` |
            | macOS 13+ Intel | `GeoIntel-macos-intel.zip` |
            | macOS 14+ Apple Silicon (M1/M2/M3/M4) | `GeoIntel-macos-arm64.zip` |
            | Linux x64 (Ubuntu 22.04+) | `GeoIntel-linux-x64.zip` |

            ### Installation

            1. Download and extract the zip for your platform.
            2. Install the Python environment (PyTorch + pipeline deps) — see README.
            3. Activate your environment and launch `GeoIntel` (or `GeoIntel.exe`).

            The binary detects your active Python environment automatically.
